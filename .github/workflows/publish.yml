name: Build and publish

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          if (process.env.GITHUB_REF_NAME !== `v${pkg.version}`) {
            throw new Error('Release tag must match package.json version');
          }
          NODE
      - run: npm install --global pnpm@11.1.0 --ignore-scripts
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - run: pnpm run build
      - run: pnpm run typecheck
      - run: pnpm run format:check
      - run: pnpm test
      - run: timeout 120s pnpm run test:fuzz 250
      - run: pnpm run test:package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: npm-package
          path: build/*.tgz
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: package
      - run: npm publish ./package/*.tgz --ignore-scripts
